<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike 2 - Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo"><a href="index.html"><img src="images/logo.png" alt="CS2 Logo"></a></div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneos.html">Torneos</a></li>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN -->
    <main>
        <section class="contact-page">
            <div class="contact-container">
                <h1>Contacto</h1>
                <p class="contact-intro">
                    ¿Tienes dudas o comentarios? Completa el formulario y nos pondremos en contacto contigo lo antes posible.
                </p>

                <form class="contact-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" placeholder="Tu nombre completo" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Mensaje:</label>
                        <textarea id="message" name="message" rows="6" placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn">Enviar Mensaje</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2025 Valve Corporation. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
